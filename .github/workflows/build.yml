name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip zip unzip openjdk-17-jdk wget

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer cython kivy

    # 🔥 Install Android SDK tools manually
    - name: Install Android SDK
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip commandlinetools-linux-9477386_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ || true

        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

    # 🔥 Accept licenses (NOW it works)
    - name: Accept Licenses
      run: yes | sdkmanager --licenses

    - name: Initialize buildozer
      run: buildozer init || true

    - name: Configure buildozer
      run: |
        sed -i 's/^title =.*/title = Cone Calculator/' buildozer.spec
        sed -i 's/^package.name =.*/package.name = conecalc/' buildozer.spec
        sed -i 's/^# requirements =.*/requirements = python3,kivy/' buildozer.spec
        sed -i 's/^source.include_exts =.*/source.include_exts = py,kv/' buildozer.spec

    - name: Build APK
      run: buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
