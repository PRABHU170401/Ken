name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-pip git zip unzip openjdk-17-jdk
        pip install --upgrade pip
        pip install buildozer cython kivy

    - name: Initialize buildozer
      run: buildozer init || true

    - name: Setup buildozer.spec
      run: |
        sed -i 's/^title =.*/title = Cone Calculator/' buildozer.spec
        sed -i 's/^package.name =.*/package.name = conecalc/' buildozer.spec
        sed -i 's/^# requirements =.*/requirements = python3,kivy/' buildozer.spec
        sed -i 's/^source.include_exts =.*/source.include_exts = py,kv/' buildozer.spec

    - name: Build APK
      run: |
        buildozer android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: bin/*.apk
